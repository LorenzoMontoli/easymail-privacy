<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Easymail</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://easymail-app.com/">
<meta http-equiv="refresh" content="0; url=./">
<script>
  /* The app page now lives at the root of the site. The language chosen elsewhere
     travels as a hash, which there means "this language, top of the page". */
  (function () {
    var lang = new URLSearchParams(location.search).get("lang");
    location.replace("./" + (lang ? "#" + lang : location.hash));
  })();
</script>
</head>
<body>
<p><a href="./">easymail-app.com</a></p>
</body>
</html>
